<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explaining Trust in Aggregate Data Results</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#15181d; --muted:#5c6470; --line:#dfe3e8;
    --accent:#2c5fa8; --accent-soft:#e8eff9; --warn:#8a5a00; --warn-soft:#fdf3e0;
    --evid:#fff2cc; --evid-line:#e0b64d; --ok:#1f6b45;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:860px;margin:0 auto;padding:16px 20px 48px}
  /* Task screens: one screen, two panes. Left holds the sentence, the numbers, the check
     and the decision; right holds the table at full height. The pilot participant was
     scrolling between the rows and the decision and lost track of both. */
  #app.two{max-width:none;display:grid;grid-template-columns:minmax(480px,44%) minmax(0,1fr);gap:14px;
           height:calc(100vh - 46px);padding:12px 14px;overflow:hidden}
  #app.two .left,#app.two .right{min-width:0;overflow:auto;display:flex;flex-direction:column;gap:10px}
  #app.two .card{margin:0;padding:12px 14px}
  #app.two h2{font-size:15.5px;margin:0 0 6px}
  #app.two h3{font-size:12px;margin:0 0 5px}
  #app.two textarea{min-height:46px}
  #app.two .foot{margin-top:8px}
  #app.two p{margin:0 0 6px}
  #app.two .right #k-rows{flex:1;display:flex;flex-direction:column;min-height:0}
  #app.two .tablewrap{max-height:none;flex:1;min-height:0}
  @media (max-width:980px){
    #app.two{display:block;height:auto;overflow:visible}
    #app.two .left,#app.two .right{display:block}
    #app.two .card{margin:0 0 12px}
    #app.two .tablewrap{max-height:440px}
  }
  header.bar{background:var(--ink);color:#fff;padding:10px 20px;display:flex;
             align-items:center;gap:16px;flex-wrap:wrap}
  header.bar b{font-weight:600}
  header.bar .sp{flex:1}
  .pill{background:rgba(255,255,255,.14);padding:3px 10px;border-radius:99px;font-size:13px}
  #hdrPilot{background:#9a5b00;color:#fff;font-weight:600;letter-spacing:.02em}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;
        padding:18px 20px;margin:16px 0;position:relative}
  h1{font-size:22px;margin:0 0 6px} h2{font-size:17px;margin:0 0 10px}
  h3{font-size:13px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  p{margin:0 0 10px} ul{margin:0 0 10px 20px;padding:0} li{margin:4px 0}
  .muted{color:var(--muted)}
  .ask{font-size:17.5px;line-height:1.45;margin:0 0 10px}
  .ask q{font-style:normal;quotes:"“" "”"}
  .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 2px}
  .metric{background:var(--accent-soft);border:1px solid #cfdcf0;border-radius:8px;padding:6px 10px}
  .metric .k{font-size:11.5px;color:var(--muted)}
  .metric .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
  .tablewrap{border:1px solid var(--line);border-radius:8px;max-height:440px;overflow:auto}
  table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
  th,td{padding:2px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;line-height:1.35}
  tbody tr:nth-child(even){background:#fafbfc}
  th:nth-child(-n+3),td:nth-child(-n+3){text-align:left}
  thead th{position:sticky;top:0;background:#eef1f5;cursor:pointer;user-select:none;
           border-bottom:1px solid #c9cfd8;font-weight:600}
  thead th:hover{background:#e4e9ef}
  tbody tr:hover{background:#f7f9fc}
  tbody tr.evid, tbody tr.evid:nth-child(even){background:var(--evid)}
  tbody tr.evid:hover{background:#fdeab8}
  tr.evid td:first-child{box-shadow:inset 3px 0 0 var(--evid-line)}
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  input[type=text],select,textarea{font:inherit;padding:7px 10px;border:1px solid #c3cad3;
    border-radius:7px;background:#fff;color:inherit}
  textarea{width:100%;min-height:90px;resize:vertical;line-height:1.5}
  button{font:inherit;padding:9px 16px;border-radius:8px;border:1px solid var(--accent);
         background:var(--accent);color:#fff;cursor:pointer}
  button.ghost{background:#fff;color:var(--accent)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .note{background:var(--warn-soft);border:1px solid #ecd5a4;border-left:4px solid var(--evid-line);
        border-radius:8px;padding:10px 14px;color:#4a3a12}
  .check{border:1px solid #e0b64d;background:#fffbea;border-radius:10px;padding:10px 14px}
  .check .head{font-size:16px;font-weight:600;margin:0 0 4px}
  .check .rows{margin:0 0 8px}
  .check .hedge{color:#5a4a1a;font-size:13.5px;margin:0}
  .delta{margin-top:6px;padding-top:6px;border-top:1px dashed #e0b64d;font-size:15px}
  .delta b{font-variant-numeric:tabular-nums}
  .delta .muted{font-size:14px}
  .check.empty{background:#f4f6f8;border-color:var(--line)}
  .example{opacity:.75;border:1px dashed #c9cfd8;border-radius:8px;padding:10px 12px;margin-top:10px;
           background:#fff}
  .example .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
                color:var(--muted);margin-bottom:6px}
  .opts{display:grid;gap:5px;margin:4px 0 10px}
  .opt{border:1px solid #c3cad3;border-radius:8px;padding:6px 11px;cursor:pointer;background:#fff;line-height:1.35}
  .opt:hover{border-color:var(--accent)}
  .opt input{margin-right:8px}
  .opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
  .opt .d{color:var(--muted);font-size:12.5px;margin-left:24px}
  .scale{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
  .scale label{border:1px solid #c3cad3;border-radius:7px;padding:5px 11px;cursor:pointer;background:#fff}
  .scale label.sel{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
  .scale input{display:none}
  .foot{display:flex;gap:12px;align-items:center;margin-top:12px;flex-wrap:wrap}
  .q{margin:0 0 18px;padding-bottom:16px;border-bottom:1px solid var(--line)}
  .q:last-child{border-bottom:none;padding-bottom:0}
  .q .qt{font-weight:600;margin-bottom:6px}
  .q .qh{color:var(--muted);font-size:14px;margin-bottom:8px}
  .choices{display:grid;gap:7px;margin-top:4px}
  .choices label{display:flex;gap:9px;align-items:flex-start;padding:8px 11px;
    border:1px solid #c3cad3;border-radius:7px;background:#fff;cursor:pointer;font-size:15px}
  .choices label:hover{border-color:var(--accent)}
  .choices label.sel{border-color:var(--accent);background:var(--accent-soft)}
  .choices input{margin:3px 0 0}
  .inline{display:flex;gap:7px;flex-wrap:wrap}
  .inline label{padding:7px 13px;border:1px solid #c3cad3;border-radius:7px;background:#fff;
    cursor:pointer;font-size:15px}
  .inline label.sel{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
  .inline input{display:none}
  textarea.sm{min-height:60px}
  .gate{display:grid;gap:9px;margin:4px 0 14px}
  .gate label{display:flex;gap:9px;align-items:flex-start;font-size:15px;line-height:1.45}
  .tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;
       background:#eceff3;color:var(--muted);margin-left:6px;vertical-align:middle}
  .tag.tut{background:#e7f3ec;color:var(--ok)}
  /* walkthrough */
  .spot{outline:3px solid var(--accent);outline-offset:4px;border-radius:10px}
  .dim{filter:blur(4px);opacity:.45;pointer-events:none;transition:filter .25s,opacity .25s}
  #app.touring .card, #app.touring #k-check{pointer-events:none}
  #app.touring .tour{pointer-events:auto}
  .tour{position:fixed;left:14px;bottom:14px;width:min(44vw,620px);min-width:300px;z-index:30;
        background:var(--ink);color:#fff;border-radius:12px;padding:14px 18px;
        box-shadow:0 8px 30px rgba(0,0,0,.25)}
  .tour .step{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
              opacity:.7;margin-bottom:4px}
  .tour p{margin:0 0 10px;font-size:16px;line-height:1.5}
  .tour button{background:#fff;color:var(--ink);border-color:#fff}
  .tour button.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
</style>
</head>
<body>
<header class="bar">
  <b>Aggregate Result Review</b>
  <span class="pill" id="hdrParticipant">no participant</span>
  <span class="pill" id="hdrProgress"></span>
  <span class="pill" id="hdrPilot" hidden>pilot, not analysed</span>
  <span class="sp"></span>
  <span class="pill" id="hdrIface"></span>
</header>
<div class="wrap" id="app"></div>

const S = {pid:null, queue:[], idx:0, log:{responses:[]}, taskStart:null,
           sort:{col:null,dir:1}, filter:"", events:[], seen:new Set()};

/* Interaction log. Verbal reports show what a participant attended to, not everything
   (Ericsson & Simon, 1993). These events are a second, behavioral source: did they sort,
   filter, and did the flagged rows and the check panel ever reach the screen. Nothing
   here changes what the participant sees or can do. */
function logEvent(type, detail){
  const t = S.queue[S.idx];
  if (!t) return;
  S.events.push({case_id:t.case_id, interface:t.interface, type,
                 detail: detail === undefined ? null : detail,
                 seconds_into_task: S.taskStart ? Math.round((Date.now()-S.taskStart)/1000) : null,
                 at:new Date().toISOString()});
}
function watchVisibility(root){
  if (!("IntersectionObserver" in window)) return;
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      const key = e.target.dataset.watch;
      if (!key || S.seen.has(key)) return;
      S.seen.add(key); logEvent("first_seen", key); io.unobserve(e.target);
    });
  }, {threshold: 0.5});
  root.querySelectorAll("[data-watch]").forEach(el => io.observe(el));
}

/* ------------------------------------------------------------- task queue */
function buildQueue(pid){
  const lookup = isPilot(pid) ? DATA.assignment[0].participant_id : pid;
  const rows = DATA.assignment.filter(r => r.participant_id === lookup)
                              .sort((a,b) => a.task_position - b.task_position);
  // The warm-up always uses the explanation layout, for everyone, so that every
  // participant has seen what a flagged row and a check look like before a scored task.
  const q = [{case_id:"T0", interface:"explanation", scored:false, position:0, scenario_type:"tutorial"}];
  rows.forEach(r => q.push({case_id:r.case_id, interface:r.interface, scored:true,
                            position:r.task_position, scenario_type:r.scenario_type}));
  return q;
}

/* ------------------------------------------------------------------ table */
const COLS = [
  ["scenario_row_id","Row"], ["tpep_pickup_datetime","Pickup"], ["tpep_dropoff_datetime","Drop-off"],
  ["duration_min","Minutes"], ["trip_distance","Miles"], ["fare_amount","Fare"],
];
const DECIMALS = {trip_distance:2, fare_amount:2, duration_min:1};
const fmt = (k, v) => (typeof v === "number" && k in DECIMALS) ? v.toFixed(DECIMALS[k]) : v;

function renderTable(c, showEvidence){
  let rows = c.rows.slice();
  // A number matches a cell whose value is exactly that number ("0" or "0.00" finds the
  // zero-mile trips, "10" finds $10.00 fares). Anything else, such as a row ID or a time
  // like 23:18, is searched as text. Plain text matching made "0.00" also catch $10.00.
  const q = S.filter.trim().toLowerCase();
  if (q){
    const isNum = /^\d+(\.\d*)?$|^\.\d+$/.test(q);
    const n = isNum ? parseFloat(q) : null;
    rows = rows.filter(r => COLS.some(([k]) => {
      const v = r[k];
      if (isNum) return typeof v === "number" && k in DECIMALS && Number(fmt(k, v)) === n;
      return String(fmt(k, v) ?? "").toLowerCase().includes(q);
    }));
  }
  if (S.sort.col){
    const k = S.sort.col, d = S.sort.dir;
    rows.sort((a,b) => (typeof a[k]==="number" && typeof b[k]==="number")
      ? (a[k]-b[k])*d : String(a[k]??"").localeCompare(String(b[k]??""))*d);
  }
  const ev = new Set(showEvidence ? c.evidence_row_ids : []);
  const head = COLS.map(([k,l]) =>
    `<th data-k="${k}">${l}${S.sort.col===k ? (S.sort.dir>0?" ▲":" ▼") : ""}</th>`).join("");
  const body = rows.map(r => {
    const watched = c.evidence_row_ids.includes(r.scenario_row_id);
    return `<tr class="${ev.has(r.scenario_row_id)?'evid':''}">` +
      COLS.map(([k], j) => `<td${watched && j===0 ? ` data-watch="row_${r.scenario_row_id}"` : ""}>${esc(fmt(k, r[k]))}</td>`).join("") +
      `</tr>`;
  }).join("");
  const el = $(`<div style="display:flex;flex-direction:column;min-height:0;flex:1">
    <div class="controls" style="margin-bottom:8px">
      <input type="text" id="flt" placeholder="Filter rows" value="${esc(S.filter)}" style="width:170px">
      <span class="muted" style="font-size:13px">${rows.length} of ${c.rows.length} rows ·
        click a heading to sort · type a value, a row or a time to filter</span>
    </div>
    <div class="tablewrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
  </div>`);
  el.querySelectorAll('thead th').forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    S.sort = (S.sort.col === k) ? {col:k, dir:-S.sort.dir} : {col:k, dir:1};
    logEvent("sort", {column:k, direction:S.sort.dir > 0 ? "asc" : "desc"});
    refreshTable();
  });
  const inp = el.querySelector('#flt');
  inp.oninput = e => { S.filter = e.target.value;
    clearTimeout(window.__fltT); window.__fltT = setTimeout(() => logEvent("filter", S.filter), 600);
    const p = inp.selectionStart; refreshTable();
    const n = document.getElementById('flt'); if (n){ n.focus(); n.setSelectionRange(p,p); } };
  return el;
}

/* Sorting and filtering redraw the table only. Redrawing the whole screen wiped the
   decision, confidence and explanation a participant had already entered (seen in P6). */
function refreshTable(){
  const t = S.queue[S.idx]; if (!t) return;
  const card = document.getElementById('k-rows'); if (!card) return;
  const old = card.querySelector('.tablewrap'); const top = old ? old.scrollTop : 0;
  card.innerHTML = "";
  card.append(renderTable(CASES[t.case_id], t.interface === "explanation"));
  const wrap = card.querySelector('.tablewrap'); if (wrap) wrap.scrollTop = top;
  watchVisibility(card);
}

    <div class="metric"><div class="k">Average fare</div><div class="v">${money(r.fare_mean)}</div></div>
    <div class="metric"><div class="k">Average miles</div><div class="v">${r.distance_mean.toFixed(2)}</div></div>
    <div class="metric"><div class="k">Average minutes</div><div class="v">${r.duration_mean.toFixed(1)}</div></div>

/* The check panel. One finding, the rows it points at, one hedge, one number. */
function checkPanel(c){
  const n = c.evidence_row_ids.length;
  if (!n){
    return `<div class="check empty" data-watch="panel_check">
      <div class="head">No check found anything odd in these rows.</div>
      <p class="hedge">That does not prove the data is right. It only means the checks found nothing.</p>
    </div>`;
  }
  const s = c.sensitivity;
  return `<div class="check" data-watch="panel_check">
    <div class="head">${esc(c.check_headline)}</div>
    <div class="rows">Rows <b>${c.evidence_row_ids.join(", ")}</b>, highlighted in yellow below.</div>
    <p class="hedge">${esc(c.check_hedge)}</p>
    <div class="delta" data-watch="panel_sensitivity">
      ${c.scenario_type === "controlled_duplicate"
        ? "Counting that trip once instead of twice,"
        : `Without ${n === 1 ? "that row" : "those " + n + " rows"},`} the average fare would be
      <b>${money(s.result.fare_mean)}</b> instead of ${money(c.result.fare_mean)}
      (${s.result.fare_mean >= c.result.fare_mean ? "+" : "−"}${money(Math.abs(s.result.fare_mean - c.result.fare_mean)).slice(1)}).
      <span class="muted">This is only a preview, not a fix.</span>
    </div>
  </div>`;
}

/* ------------------------------------------------------------------- task */
function screenTask(keepScroll){
  if (keepScroll){ const r = app.querySelector('.right'); S.rightScroll = r ? r.scrollTop : 0; }
  const t = S.queue[S.idx];
  if (!t) return screenDone();
  const c = CASES[t.case_id];
  const expl = t.interface === "explanation";
  if (!keepScroll){ S.taskStart = Date.now(); S.sort = {col:null,dir:1}; S.filter=""; S.seen = new Set(); }
  header(); app.innerHTML = ""; app.classList.add("two");
  const left = $(`<div class="left"></div>`), right = $(`<div class="right"></div>`);

  left.append($(`<div class="card" id="k-claim">
    <h3 style="margin-bottom:6px">${esc(c.zone_label)} · ${esc(c.date)}, ${String(c.hour).padStart(2,"0")}:00–${String(c.hour).padStart(2,"0")}:59
      ${t.scored ? "" : '<span class="tag tut">warm-up</span>'}</h3>
    <p class="ask">${esc(CTX.lead_in)} <q>${esc(c.claim_text)}</q></p>
    ${metrics(c.result)}
    <p class="muted" style="margin:6px 0 0;font-size:13px">Computed from the ${c.result.trip_count} trips on the right.</p>
  </div>`));

  left.append(decisionCard(c, t));

  // The check sits directly above the rows it points at, not beside the decision.
  if (expl){
    const card = $(`<div id="k-check"></div>`);
    card.innerHTML = checkPanel(c);
    right.append(card);
  }
  const tbl = $(`<div class="card" id="k-rows" data-watch="panel_raw_rows"></div>`);
  tbl.append(renderTable(c, expl));
  right.append(tbl);

  app.append(left, right);
  watchVisibility(app);
  if (keepScroll){ const r = app.querySelector('.right'); if (r) r.scrollTop = S.rightScroll || 0; }
  // The warm-up tour survives a sort or filter: those re-render the screen, so the tour
  // is re-attached at the step it was on rather than lost.
  if (!t.scored && !S.tourDone) startTour(S.tourStep || 0);
}

/* ------------------------------------------------------------- walkthrough */
/* The warm-up walks the participant through each part of the screen in turn. The pilot
   showed that a warm-up without this taught nothing: the participant met the check panel
   for the first time in a scored case and did not know what it was for. */
const TOUR = [
  {sel:"#k-claim", text:"This is the sentence your labmate wants to write. You decide if it should go in. The four boxes are the numbers it is based on. \"Average\" means the mean."},
  {sel:"#k-rows",  text:"These are all the trips behind that sentence, one row per taxi ride: when it started and ended, how long it took, how far it went, and the fare. Click a column name to sort. Type in the box to filter."},
  {sel:"#k-check", text:"On some cases this yellow box appears. It tells you if an automatic check found something odd, which rows, and what the average would be without them. Nothing was found in this warm-up, so it is grey. Below is what it looks like when something is found.", example:true},
  {sel:"#k-decide",text:"Then you decide. \"Not yet\" means you know what to check but not the answer. \"Fix one thing\" means you know the fix. Pick one, say how sure you are, write one line. Keep talking the whole time. Press the button below to try it on the warm-up."},
];
function startTour(from){
  let i = from || 0;
  const tour = $(`<div class="tour"><div class="step"></div><p></p>
    <div class="foot" style="margin:0"><button id="tnext">Next</button></div></div>`);
  app.append(tour);
  app.classList.add('touring');
  document.getElementById('hdrProgress').textContent = "tour";
  const clear = () => {
    document.querySelectorAll('.spot').forEach(e=>e.classList.remove('spot'));
    document.querySelectorAll('.dim').forEach(e=>e.classList.remove('dim'));
    const ex = document.getElementById('tour-example'); if (ex) ex.remove();
  };
  const show = () => {
    clear();
    S.tourStep = i;
    const st = TOUR[i];
    const target = document.querySelector(st.sel);
    tour.querySelector('.step').textContent = `Tour ${i+1} of ${TOUR.length}`;
    tour.querySelector('p').textContent = st.text;
    tour.querySelector('#tnext').textContent = i === TOUR.length-1 ? "Start the warm-up" : "Next";
    document.querySelectorAll('#app .card, #app #k-check').forEach(cd => {
      if (cd !== target && !target.contains(cd) && !cd.contains(target)) cd.classList.add('dim'); });
    if (target){
      target.classList.add('spot');
      if (st.example){
        target.append($(`<div class="example" id="tour-example">
          <div class="lbl">Example of a check that fired (not this case)</div>
          <div class="check">
            <div class="head">2 of 30 trips show 0.00 miles but still a fare.</div>
            <div class="rows">Rows <b>R011, R024</b>, highlighted in yellow below.</div>
            <p class="hedge">Odd, but not necessarily wrong: it could be a cancelled or very short ride.</p>
            <div class="delta">Without those 2 rows, the average fare would be <b>$14.10</b> instead of $13.66 (+$0.44).
              <span class="muted">This is only a preview, not a fix.</span></div>
          </div>
          <div style="margin-top:8px;font-size:14px;color:var(--muted)">And the highlighted rows look like this, in among the others:</div>
          <table style="margin-top:4px"><tbody>
            <tr><td>R010</td><td>2024-06-30 23:24:02</td><td>2024-06-30 23:31:40</td><td>7.6</td><td>1.90</td><td>10.00</td></tr>
            <tr class="evid"><td>R011</td><td>2024-06-30 23:25:36</td><td>2024-06-30 23:26:19</td><td>0.7</td><td>0.00</td><td>3.00</td></tr>
            <tr><td>R012</td><td>2024-06-30 23:27:10</td><td>2024-06-30 23:38:55</td><td>11.8</td><td>2.40</td><td>13.50</td></tr>
            <tr class="evid"><td>R024</td><td>2024-06-30 23:41:26</td><td>2024-06-30 23:47:03</td><td>5.6</td><td>0.00</td><td>6.50</td></tr>
          </tbody></table>
        </div>`));
      }
      target.scrollIntoView({block:"nearest", behavior:"smooth"});
    }
  };
  tour.querySelector('#tnext').onclick = () => {
    i++;
    if (i < TOUR.length) return show();
    clear(); tour.remove(); S.tourDone = true;
    app.classList.remove('touring'); header();
    app.querySelectorAll('.left,.right').forEach(p => p.scrollTop = 0);
    window.scrollTo(0,0);
  };
  show();
}

function decisionCard(c, t){
  const card = $(`<div class="card" id="k-decide">
    <h2>Should this sentence go into the draft?</h2>
    <div class="opts" id="opts">
      ${DECISIONS.map(([v,l,d])=>`<label class="opt" data-v="${v}">
         <input type="radio" name="dec" value="${v}"><b>${l}</b>
         <div class="d">${d}</div></label>`).join("")}
    </div>
    <h3>How confident are you?</h3>
    <div class="scale" id="conf">
      ${[1,2,3,4,5,6,7].map(i=>`<label data-v="${i}"><input type="radio" name="conf" value="${i}">${i}</label>`).join("")}
    </div>
    <p class="muted" style="margin-top:2px;font-size:12.5px">1 = not at all, 7 = completely</p>
    <h3 style="margin-top:10px">One line: what made you decide that?</h3>
    <input type="text" id="why" placeholder="What did you look at?" style="width:100%">
    <div class="foot">
      <button id="next" disabled>${S.idx === S.queue.length-1 ? "Finish the cases" : "Submit and continue"}</button>
      <span class="muted" id="hint">A decision, a confidence rating, and one line are needed.</span>
    </div>
  </div>`);
  const sel = {dec:null, conf:null};
  const check = () => {
    const ok = sel.dec && sel.conf && card.querySelector('#why').value.trim().length >= 3;
    card.querySelector('#next').disabled = !ok;
    card.querySelector('#hint').textContent = ok ? "" : "A decision, a confidence rating, and one line are needed.";
  };
  card.querySelectorAll('#opts .opt').forEach(o => o.onclick = () => {
    card.querySelectorAll('#opts .opt').forEach(x=>x.classList.remove('sel'));
    o.classList.add('sel'); o.querySelector('input').checked = true; sel.dec = o.dataset.v; check();
  });
  card.querySelectorAll('#conf label').forEach(o => o.onclick = () => {
    card.querySelectorAll('#conf label').forEach(x=>x.classList.remove('sel'));
    o.classList.add('sel'); o.querySelector('input').checked = true; sel.conf = Number(o.dataset.v); check();
  });
  card.querySelector('#why').oninput = check;
  card.querySelector('#next').onclick = () => {
    S.log.responses.push({
      participant_id: S.pid, case_id: c.case_id, scenario_type: t.scenario_type,
      interface: t.interface, scored: t.scored, task_position: t.position,
      decision: sel.dec, confidence: sel.conf,
      explanation: card.querySelector('#why').value.trim(),
      seconds_on_task: Math.round((Date.now() - S.taskStart)/1000),
      submitted_at: new Date().toISOString(),
      interactions: S.events.filter(e => e.case_id === c.case_id && e.interface === t.interface),
    });
    S.idx++;
    if (S.idx < S.queue.length) screenBreak(); else screenInterview();
  };
  return card;
}

function screenBreak(){
  const t = S.queue[S.idx], prev = S.queue[S.idx-1];
  const changed = prev && prev.interface !== t.interface;
  header(); app.innerHTML = ""; app.classList.remove("two");
  app.append($(`<div class="card">
    <h1>${S.idx === 1 ? "Warm-up done" : "Next case"}</h1>
    <p>${S.idx === 1 ? "The four real cases work the same way. " : ""}${
      changed ? (t.interface === "explanation"
        ? "This one has the yellow check box and highlighted rows."
        : "This one shows the rows only, with no check box.")
      : "A different zone and hour."}</p>
    <div class="foot"><button id="n">Continue</button></div>
  </div>`));
  document.getElementById('n').onclick = () => screenTask();
}

/* ------------------------------------------------------------------ interview */
function screenInterview(){
  header(); app.innerHTML = ""; app.classList.remove("two");
  const card = $(`<div class="card">
    <h1>Six questions to finish</h1>
    ${INTERVIEW.map((q,i)=>`<div class="q"><div class="qt">${i+1}. ${esc(q)}</div>
      <textarea class="sm" id="iv_${i}" placeholder="Type your answer here"></textarea></div>`).join("")}
    <div class="foot"><button id="next">Continue</button></div>
  </div>`);
  card.querySelector('#next').onclick = () => {
    S.log.interview = INTERVIEW.map((q,i) => ({question:q, answer: card.querySelector(`#iv_${i}`).value.trim()}));
    screenDebrief();
  };
  app.append(card); window.scrollTo(0,0);
}

/* -------------------------------------------------------------------- debrief */
function screenDebrief(){
  header(); app.innerHTML = ""; app.classList.remove("two");
  app.append($(`<div class="card">
    <h1>Debrief</h1>
    <p class="muted">Facilitator reads this aloud.</p>
    <p style="font-size:17px">Two of the four cases had a trip that I copied on purpose, so one trip
    was in the table twice. That is a real problem with a clear fix. The other two had trips with
    zero miles, which really happens in this data and has no clear fix, so saying "check this" is a
    fair answer. There was no right answer I was marking you against. I wanted to see what people
    look at. Any questions?</p>
    <div class="q" style="margin-top:16px"><div class="qt">Anything said after the debrief</div>
      <textarea id="iv_post" placeholder="Optional"></textarea></div>
    <div class="foot"><button id="next">Finish and export</button></div>
  </div>`));
  document.getElementById('next').onclick = () => {
    S.log.post_debrief_notes = document.getElementById('iv_post').value.trim();
    screenDone();
  };
}

function screenDone(){
  S.log.finished_at = new Date().toISOString();
  header();
  const blob = JSON.stringify(S.log, null, 2);
  app.innerHTML = ""; app.classList.remove("two");
  app.append($(`<div class="card">
    <h1>Session complete</h1>
    <p class="muted">Download the file. ${isPilot(S.pid) ? "<b>Pilot:</b> save it to <code>sessions/pilot/</code>." : "Save it to <code>sessions/" + esc(S.pid) + "/</code>."}</p>
    <div class="foot">
      <button id="dl">Download session file</button>
      <button class="ghost" id="cp">Copy to clipboard</button>
      <span class="muted" id="st"></span>
    </div>
    <h3 style="margin-top:18px">Session record</h3>
    <pre style="font:12px/1.4 var(--mono);background:#f2f4f7;border:1px solid var(--line);border-radius:8px;padding:12px;max-height:300px;overflow:auto">${esc(blob)}</pre>
  </div>`));
  document.getElementById('dl').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([blob], {type:"application/json"}));
    a.download = `${isPilot(S.pid) ? "PILOT_" : ""}session_${S.pid}.json`; a.click();
    document.getElementById('st').textContent = "saved";
  };
  document.getElementById('cp').onclick = async () => {
    try { await navigator.clipboard.writeText(blob); document.getElementById('st').textContent = "copied"; }
    catch (e) { document.getElementById('st').textContent = "select the text below and copy it"; }
  };
}

screenSetup();
</script>
</body>
</html>
